name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 发布 Release 需要写权限（GITHUB_TOKEN 默认可能只有读权限）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(command -v sdkmanager || true)
          if [ -z "$SDKMGR" ]; then
            for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                     "$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"; do
              if [ -x "$p" ]; then SDKMGR="$p"; break; fi
            done
          fi
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$SDKMGR" "platforms;android-34"
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            yes | "$SDKMGR" "build-tools;34.0.0"
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # 把 GitHub Secrets 里的 BASE64 还原成 keystore 文件。
      # 写到 RUNNER_TEMP（仓库目录之外），不会进代码库，每次编译用完即弃。
      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 未配置，跳过正式签名（build.gradle 会回退默认调试签名）"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/timelog.jks"
          if [ ! -s "$RUNNER_TEMP/timelog.jks" ]; then
            echo "keystore 解码失败：文件为空，请检查 KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "keystore 已就位：$RUNNER_TEMP/timelog.jks"

      # 仍构建 debug，产物路径和 Artifact 名字都不变，下载/安装方式照旧。
      # 但现在 APK 是用你自己的密钥签的（不再是系统临时调试密钥）。
      - name: Build APK (signed)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/timelog.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      # 签名没成功就在这里直接失败，避免下载到一个装不上的包
      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "未找到 apksigner，跳过校验（不影响产出 APK）"
            exit 0
          fi
          "$APKSIGNER" verify app/build/outputs/apk/debug/app-debug.apk
          echo "APK 签名校验通过"

      # 把 APK 改名为 Timelog-<版本号>.apk，例如 Timelog-1.6.1.apk
      # 版本号读 Gradle 落盘的文件，保证和 App 内「应用信息」显示的一致。
      - name: Rename APK with version
        id: apk
        shell: bash
        run: |
          SRC=app/build/outputs/apk/debug/app-debug.apk
          VER_FILE=app/build/timelog-versionName.txt
          if [ -f "$VER_FILE" ]; then
            VER=$(tr -d '[:space:]' < "$VER_FILE")
          else
            # 正常不会有这一天：build.gradle 在配置阶段就写好了版本号文件
            VER="dev-$(date -u -d '+8 hours' +%Y%m%d%H%M)"
            echo "::warning::未找到版本号文件，按当前时刻估算为 $VER"
          fi
          DEST="app/build/outputs/apk/debug/Timelog-${VER}.apk"
          mv "$SRC" "$DEST"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          echo "APK 文件名：Timelog-${VER}.apk"

      # Artifacts 下载时一定会被 GitHub 打包成 zip（平台机制，改不了），
      # 所以同时发一个 Release：里面的 .apk 是原始文件，点一下直接下载，不用解压。
      - name: Publish direct APK to Release
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.apk }}
          VER: ${{ steps.apk.outputs.ver }}
        run: |
          TAG="v${VER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "TimeLog ${VER}" \
              --notes "自动构建 ${VER}（提交 ${GITHUB_SHA:0:7}，第 ${GITHUB_RUN_NUMBER} 次运行）"
          fi
          echo "直链：https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$APK")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Timelog-${{ steps.apk.outputs.ver }}-zip
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
