plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本号分两个，各管各的：
//   versionName = 人看的版本号（1.6.6），发版时**只改下面这一行**。
//                 它决定 APK 文件名 Timelog-1.6.6.apk、Release 标签 v1.6.6、手机「应用信息」里显示的数字。
//   versionCode = 系统看的序号，由编译时刻的分钟数自动生成（约 2900 万，远低于 Android 上限 21 亿）。
//                 手机上不显示，但**每次编译都会变大**，所以覆盖安装不会被系统当成同一版本。
def appVersionName = '1.6.6'

def buildStamp = System.currentTimeMillis()
def ciBuildNumber = (buildStamp / 60000L) as int       // 分钟级序号，只给 versionCode 用

// 把这次的版本号落盘，供 workflow 给 APK 改文件名用。
// 关键：文件名必须用 Gradle 真实使用的版本号，不能在 shell 里另算一次，
// 否则文件名会和 App 里显示的版本号对不上。
def versionOut = new File(project.buildDir, 'timelog-versionName.txt')
versionOut.parentFile.mkdirs()
versionOut.text = "${appVersionName}\n"

// ---- 正式签名 ----
// GitHub 仓库里已存 4 个 Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD。
// workflow 会把 BASE64 解码成临时 keystore 文件，并把 4 个值作为环境变量传进来。
// 四项齐全才用你自己的密钥签名；缺任意一项就回退到系统默认调试签名，
// 保证换电脑、本地编译、Secret 临时没配时，依然能编出可安装的 APK。
def ksFile = System.getenv('KEYSTORE_FILE')
def ksPassword = System.getenv('KEYSTORE_PASSWORD')
def ksAlias = System.getenv('KEY_ALIAS')
def ksKeyPassword = System.getenv('KEY_PASSWORD')
def hasSigning = ksFile && ksPassword && ksAlias && ksKeyPassword && file(ksFile).exists()
println(hasSigning
    ? "TimeLog: 使用正式签名 -> $ksFile"
    : 'TimeLog: 未检测到签名配置，回退默认调试签名')

android {
    namespace 'com.example.timelog'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.timelog'
        minSdk 26
        targetSdk 34
        versionCode ciBuildNumber
        versionName appVersionName
    }

    // 只在拿到完整签名信息时才创建；名字叫 release，但 debug/release 两个构建都用它，
    // 这样无论跑哪个 assemble，签名都稳定一致，不会每次换钥匙。
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile = file(ksFile)
                storePassword = ksPassword
                keyAlias = ksAlias
                keyPassword = ksKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasSigning) signingConfig signingConfigs.release
        }
        release {
            if (hasSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
